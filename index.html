<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exam Clock Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100vh;
  width: 100vw;
  background: url('bed_col_bg.jpg') no-repeat center center fixed;
  background-size: cover;
  font-family: Roboto, Arial, sans-serif;
  color: white;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  font-size: 48px;
  margin-bottom: 40px;
  text-align: center;
  text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
}

/* Grid layout */
.button-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  width: 80%;
  max-width: 1400px;
}

/* Buttons */
button {
  font-size: 24px;
  padding: 18px;
  background-color: #f5f5f5;
  color: black;
  border: 2px solid black;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background-color: #e20000;
  color: white;
  transform: scale(1.03);
}

/* Mobile layout */
@media (max-width: 900px) {
  .button-container {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .button-container {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>Examinations Clock System</h1>


<div class="button-container">
    <button onclick="window.open('gcse-english-language-paper1.html', '_self')"> 📘 GCSE English Language Paper 1</button>
    <button onclick="window.open('gcse-maths-paper1.html', '_self')"> 📙 GCSE Mathematics Paper 1 (Non-Calculator)</button>
    <button onclick="window.open('gcse-english-language-paper2.html', '_self')"> 📗 GCSE English Language Paper 2</button>
    <button onclick="window.open('gcse-maths-paper2.html', '_self')"> 📕 GCSE Mathematics Paper 2 (Calculator)</button>
    <button onclick="window.open('gcse-maths-paper3.html', '_self')"> 📔 GCSE Mathematics Paper 3 (Calculator)</button>
    <button onclick="window.open('editable-exam.html', '_self')"> 📝 Editable Exam Template</button>
  <!--
    <button onclick="window.open('multiple-exams.html', '_blank')"> 📋 Multiple Exams Template</button>
  -->
    <button onclick="window.open('clock.html', '_blank')"> 🕒 Clock</button>
</div>


<script>
function go(page) {
  window.location.href = page;
}
</script>

</body>
</html>
