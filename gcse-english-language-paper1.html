<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GCSE English Language Paper 1</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>

html, body {
  margin: 0;
  padding: 0;
  height: 100vh;
  width: 100vw;
  background: url('bed_col_bg.jpg') no-repeat center center fixed;
  background-size: cover;
  color: white;
  font-family: Roboto, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow: hidden;
}
#clock {
  font-family: 'Orbitron', monospace;
  color: white;
  font-size: 9vw;
  text-align: center;
  background-color: transparent;
  padding: 4px 30px;
  border-radius: 10px;
  margin-top: 155px;
  letter-spacing: 0.1em;
  width: 16ch;
}
.info-container {
  margin-top: 40px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}
.info-small {
  font-size: 40px;
}
#date {
  font-size: 50px;
}
#log {
  font-size: 50px;
  margin-top: 15px;
  text-align: center;
}
#bottomRow {
  position: fixed;
  bottom: 24px;
  left: 24px;
  display: flex;
  gap: 20px;
}
button {
  padding: 6px 16px;
  font-size: 20px;
  border-radius: 8px;
  border: none;
  background-color: white;
  color: black;
  cursor: pointer;
  transition: 0.18s;
}
button:hover {
  background-color: #ff3333;
  color: white;
}
#homeBtn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 10px 20px;
  font-size: 28px;
  border-radius: 8px;
  border: none;
  background: #222;
  color: #fff;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="clock">00:00:00</div>
<div class="info-container">
  <div id="date">Tuesday 4th November 2025</div>
  <div class="info-small">Centre Name: Bedford College | Centre Number: 15119</div>
  <div class="info-small">Paper Ref: 1EN0/01 | GCSE English Language Paper 1</div>
  <div class="info-small">Duration: 1 hour 45 minutes</div>
  <div id="log"></div>
</div>
<div id="bottomRow">
  <button id="startButton">Start</button>
  <button id="extraTimeButton">+25% Time</button>
  <button id="resetButton">Reset</button>
</div>
<button id="homeBtn" onclick="location.href='index.html'">Back to Home</button>
<script>
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  const options = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
  document.getElementById('date').textContent = now.toLocaleDateString('en-GB', options);
}
setInterval(updateClock, 1000);
updateClock();

const startButton = document.getElementById('startButton');
const resetButton = document.getElementById('resetButton');
const log = document.getElementById('log');
let examStarted = false;

startButton.addEventListener('click', () => {
  if (!examStarted) {

    const now = new Date();

    // base duration: 105 minutes (1h 45m)
    const baseMinutes = 105;

    // normal end time
    const normalEnd = new Date(now.getTime() + baseMinutes * 60 * 1000);

    // extra time end (25% added)
    const extraTimeMinutes = baseMinutes + 26;
    const extraEnd = new Date(now.getTime() + extraTimeMinutes * 60 * 1000);

    // ALWAYS show normal end time
    let html = `
      <div>Start Time: <strong>${now.toLocaleTimeString('en-GB')}</strong></div>
      <div>End Time: <strong>${normalEnd.toLocaleTimeString('en-GB')}</strong></div>
    `;

    // ONLY show 25% extra end if selected
    if (useExtraTime) {
      html += `
        <div>25% Extra Time End: <strong>${extraEnd.toLocaleTimeString('en-GB')}</strong></div>
        <div>(Applicable only if 25% extra time is approved)</div>
      `;
    }

    log.innerHTML = html;

    // fullscreen
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    }

    startButton.textContent = 'Exam In Progress';
    startButton.disabled = true;
    startButton.style.backgroundColor = 'grey';
    examStarted = true;
  }
});

const extraTimeButton = document.getElementById('extraTimeButton');
let useExtraTime = false;

extraTimeButton.addEventListener('click', () => {
  useExtraTime = true;
  extraTimeButton.style.backgroundColor = 'orange';
  extraTimeButton.textContent = '25% Added';
});


resetButton.addEventListener('click', () => {
  log.innerHTML = '';

  // Reset start button
  startButton.disabled = false;
  startButton.textContent = 'Start';
  startButton.style.backgroundColor = 'white';

  // Reset extra time button
  useExtraTime = false;
  extraTimeButton.style.backgroundColor = 'white';
  extraTimeButton.textContent = '+25% Time';

  examStarted = false;
});
</script>
</body>
</html>
